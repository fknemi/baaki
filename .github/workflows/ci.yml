name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baaki
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d baaki"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/baaki
      DATABASE_URL_APP: postgres://postgres:postgres@localhost:5432/baaki
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun typecheck

      - name: Test
        run: bun test

      - name: Secrets scan
        run: bun check:secrets

      - name: Forbidden tokens
        run: bun check:forbidden

      - name: i18n parity
        run: bun check:i18n
